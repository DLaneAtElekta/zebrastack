# Phase 5: V4 -> PIT -> AIT, recognition stack (generative path deferred).
# Run: python experiments/phase5_hierarchy.py
base_config: configs/phase2.yaml   # V1 and the Design B V2 (fitted on natural photos)

data:
  n_fit: 4000        # Fashion-MNIST train images (labels unused) for fitting V4/PIT/AIT
  n_decode_train: 3000
  n_decode_test: 2000

stages:              # sheet side, TICA radius, skip source
  V4:  {sheet: 10, radius: 1, skip: V1, border: 1}
  PIT: {sheet: 12, radius: 2, skip: V2, border: 0}
  AIT: {sheet: 14, radius: 2, skip: null, border: 0}
tica: {n_iter: 300, polish_iter: 100}

transforms:          # tolerance tests: [shift_x px, rotation deg, scale]
  shift_6px: [6.0, 0.0, 1.0]
  rotate_15deg: [0.0, 15.0, 1.0]
  scale_0.85: [0.0, 0.0, 0.85]

curvature:           # V4 probe: |curvature| classes, random orientation and position jitter
  levels: [0.0, 0.05, 0.1]
  per_class: 150

checks:              # declared before running
  min_ait_accuracy: 0.5        # chance 0.1
  cluster_null_percentile: 95  # same-category neighbor fraction vs shuffled sheets
  n_shuffles: 2000

output_dir: runs/phase5
