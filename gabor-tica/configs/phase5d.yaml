# Phase 5d: V4 filters as learned combinations of fixed Gabors across V2 sheet
# neighbors (GaborMixBank), trained by temporal coherence, several refit seeds.
# Run: python experiments/phase5d_gabor_mixing.py --config configs/phase5d.yaml
phase5_config: configs/phase5b.yaml
stack_checkpoint: runs/phase5b/phase5_stages.pt

offset: 2                  # basis positions: center and +-2 V2 cells (half a Gabor wavelength) on each axis
refit_seeds: [0, 1, 2]     # whitening + TICA refits per variant (and for the learning-off baseline)

train:
  n_pairs: 1000
  pair_seed: 11
  max_shift: 4.0
  max_rot_deg: 10.0
  max_log_scale: 0.08
  optimizer: ngd           # normalized gradient descent + momentum, cosine-decayed step
  n_steps: 1200
  lr: 0.0005               # step length relative to ||A_init|| (pilot: 0.0003 x 300 steps gave drift 0.13, loss still falling)
  batch_size: 24
  refit_every: 300
  refit_n: 500
  white_weight: 1.0

temporal_weights: {still: 0.0, bubbles: 1.0}

sweep:                     # mix_radius 0 = own V2 channel only (orientation / offset mixing); 1 = 3x3 sheet neighbors
  - {mode: still,   mix_radius: 0, tether: 0.1}
  - {mode: bubbles, mix_radius: 0, tether: 0.1}
  - {mode: still,   mix_radius: 1, tether: 0.1}
  - {mode: bubbles, mix_radius: 1, tether: 0.1}
  - {mode: bubbles, mix_radius: 1, tether: 1.0}
  - {mode: bubbles, mix_radius: 1, tether: 0.01}

checks:                    # declared before running; gains are vs the learning-off stage, both averaged over refit seeds
  max_feature_diff: 1.0e-5     # identity mixing reproduces the fixed V4 features
  n_se: 2                      # a gain must also exceed n_se standard errors (refit noise)
  max_accuracy_drop: 0.01
  min_tolerance_gain: 0.02     # best bubbles variant, mean matched accuracy on transformed images
  min_invariance_gain: 0.05    # some bubbles variant, mean unit invariance index
  min_temporal_margin: 0.01    # best bubbles variant vs its still control (same radius and tether)
                               # plus: best radius-1 tolerance gain > best radius-0 gain (mixing_beats_per_channel)

output_dir: runs/phase5d
