# Phase 5e control: the still (sparsity-only) objective on matched-range pairs,
# the missing control for Phase 5e's bubbles pairs result (+0.023 transformed accuracy).
# Run: python experiments/phase5d_gabor_mixing.py --config configs/phase5e_control.yaml
phase5_config: configs/phase5b.yaml
stack_checkpoint: runs/phase5b/phase5_stages.pt
offset: 2
refit_seeds:
- 0
- 1
- 2
ranges:
  small:
    max_shift: 4.0
    max_rot_deg: 10.0
    max_log_scale: 0.08
  matched:
    max_shift: 6.0
    max_rot_deg: 15.0
    max_log_scale: 0.17
extra_transforms:
  shift_10px:
  - 10.0
  - 0.0
  - 1.0
  rotate_25deg:
  - 0.0
  - 25.0
  - 1.0
  scale_0.75:
  - 0.0
  - 0.0
  - 0.75
train:
  n_pairs: 1000
  pair_seed: 11
  optimizer: ngd
  n_steps: 1200
  lr: 0.0005
  batch_size: 24
  refit_every: 300
  refit_n: 250
  white_weight: 1.0
temporal_weights:
  still: 0.0
  bubbles: 1.0
sweep:
- mode: still
  mix_radius: 1
  tether: 0.1
  range: matched
  seq_len: 2
checks:
  max_feature_diff: 1.0e-05
  n_se: 2
  max_accuracy_drop: 0.01
  min_tolerance_gain: 0.02
  min_invariance_gain: 0.05
  min_temporal_margin: 0.01
  reference_range: small
  reference_tolerance_gain: 0.006
  min_range_margin: 0.01
output_dir: runs/phase5e_control
