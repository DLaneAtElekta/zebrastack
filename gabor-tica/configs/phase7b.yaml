# Phase 7b: a hierarchical expectation. Phase 7's sneaker expectation was shoe-general,
# so explaining it away suppressed the lookalikes too and false alarms rose. Here the
# superordinate footwear pattern is explained away, leaving the sneaker-specific
# residual as error, and attention can target that residual (sneaker minus footwear
# mean). Match rule: projection (Phase 7's z-scored match overshoots; the
# target-level projection condition separates the two changes).
# Checks as Phase 7. Run: python experiments/phase6_attention.py --config configs/phase7b.yaml
base_config: configs/phase5b.yaml
stack_checkpoint: runs/phase5b/phase5_stages.pt

template_source: bottomup    # control: category-mean V4 features instead of generated templates
topdown: {n_fit: 2000, kernel: 3, n_iter: 400, lr: 0.02}

task:
  target: 7                 # sneaker
  lookalikes: [5, 9]        # sandal, ankle boot: false-alarm test
  n_per_kind: 600          # 240 in Phase 6; more scenes to cut d' noise
  n_distractors: 3          # plus the target / lookalike; absent scenes get one more distractor
  attend_stage: V4

response_noise_T: 1.0         # calibration (no attention, AIT d'): T=1 0.56, 3 0.68, 10 0.72, 30 0.74; closest to 0.5

betas: [0.0, 1.0, 2.0]       # 0 = no attention
wrong_template: 8            # control: attend to / expect "bag" instead
spatial: false               # the spatial field had no effect in 6c-6e
expectation:                 # hierarchical predictive subtraction at V4 (gtv.thalamus.expectation)
  predict: footwear          # superordinate expectation: the group's shared pattern (sandal, sneaker, boot)
  match: projection          # amount of the predicted pattern present (Phase 7's z-scored match overshoots)
  alphas: [0.5, 1.0]
  with_beta: 2.0             # attention it is combined with (best in 6e)
  control_alpha: 1.0         # for the controls and the Kok analysis
  alone: false               # expectation alone did nothing in Phase 7
  uniform_control: false
  wrong_predict: tops        # control: the wrong superordinate group
  target_control: true       # control: the target-level expectation with the projection match
  specific_attention: true   # attention to sneaker minus the footwear mean, alone and with the expectation

checks:                      # declared before running (Phase 7 checks at the end)
  min_template_hits: 8
  max_noisy_baseline_fraction: 0.8   # the noise must cost information (noisy baseline <= 0.8 x noiseless)
  # gains are capped by the noiseless ceiling (~0.85 from ~0.5), hence lower bars than Phase 6's 0.3
  min_dprime_gain: 0.2               # feature gain, best beta vs beta = 0 (retrained readout)
  feature_min_specificity: 0.1       # ... and by this much more than the wrong-template gain
  spatial_min_dprime_gain: 0.2       # spatial feature-similarity field, best beta
  spatial_min_specificity: 0.1
  max_dprime_drop: 0.05       # Phase 7: attention + expectation keeps AIT d' within this of attention alone
  min_fa_drop: 0.05           # and lowers lookalike false alarms by at least this
                              # plus: expected-category responses suppressed more than others (Kok),
                              # and target-vs-lookalike decoding at V4 not worse with expectation

output_dir: runs/phase7b
