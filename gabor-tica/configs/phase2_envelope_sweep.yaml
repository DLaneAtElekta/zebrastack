# Phase 2 follow-up: is Design B's second-order advantage architectural, or
# an artifact of its fixed second-order scale matching the probe?
# Run: python experiments/phase2_envelope_sweep.py
base_config: configs/phase2.yaml

envelope_freqs: [0.0156, 0.022, 0.03125, 0.044, 0.0625, 0.088, 0.125, 0.177]  # cycles / image px

# Design B variants, each with its own fixed second-order scales. whiten_groups
# gives [first-order, second-order] PCA budgets; null = one shared PCA.
b_variants:
  B_shared_pca:                   # Phase 2 before the fix, for reference
    freqs: [0.0625, 0.03125]
    whiten_groups: null
  B:
    freqs: [0.0625, 0.03125]
    whiten_groups: [24, 40]
  B_shifted:                      # scales half an octave higher
    freqs: [0.088, 0.044]
    whiten_groups: [24, 40]
  B_wide:                         # four scales covering the sweep
    freqs: [0.125, 0.0625, 0.03125, 0.0156]
    whiten_groups: [24, 40]

output_dir: runs/phase2_envelope_sweep
