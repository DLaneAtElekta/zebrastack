# Phase 5e: the Phase 5d Gabor-mixing V4 (radius 1, tether 0.1) trained on
# transforms spanning the test range, as pairs and as 4-frame sequences.
# Run: python experiments/phase5d_gabor_mixing.py --config configs/phase5e.yaml
phase5_config: configs/phase5b.yaml
stack_checkpoint: runs/phase5b/phase5_stages.pt

offset: 2
refit_seeds: [0, 1, 2]

ranges:                    # end-transform ranges (uniform per axis / angle / log scale)
  small:   {max_shift: 4.0, max_rot_deg: 10.0, max_log_scale: 0.08}   # Phase 5d
  matched: {max_shift: 6.0, max_rot_deg: 15.0, max_log_scale: 0.17}   # spans the tests: 6 px, 15 deg, scale 0.85

extra_transforms:          # extrapolation beyond the matched range, reported separately
  shift_10px: [10.0, 0.0, 1.0]
  rotate_25deg: [0.0, 25.0, 1.0]
  scale_0.75: [0.0, 0.0, 0.75]

train:
  n_pairs: 1000            # sequences
  pair_seed: 11
  optimizer: ngd
  n_steps: 1200
  lr: 0.0005
  batch_size: 24           # sequences per step (T = 4: 96 frames)
  refit_every: 300
  refit_n: 250             # sequences (T = 4: 1,000 frames, as 5d's 500 pairs)
  white_weight: 1.0

temporal_weights: {still: 0.0, bubbles: 1.0}

sweep:
  - {mode: bubbles, mix_radius: 1, tether: 0.1, range: matched, seq_len: 2}
  - {mode: bubbles, mix_radius: 1, tether: 0.1, range: matched, seq_len: 4}
  - {mode: still,   mix_radius: 1, tether: 0.1, range: matched, seq_len: 4}
  - {mode: bubbles, mix_radius: 1, tether: 0.1, range: matched, seq_len: 4, temporal_weight: 3.0}

checks:                    # declared before running; gains vs learning off, mean over refit seeds
  max_feature_diff: 1.0e-5
  n_se: 2
  max_accuracy_drop: 0.01
  min_tolerance_gain: 0.02     # best bubbles variant, tested transforms
  min_invariance_gain: 0.05
  min_temporal_margin: 0.01    # best bubbles variant vs still (matched, T = 4)
  reference_range: small       # Phase 5d, bubbles r = 1 tau = 0.1, small-range pairs:
  reference_tolerance_gain: 0.006
  min_range_margin: 0.01       # a matched-range bubbles variant must beat it by this
                               # plus: best T = 4 bubbles beats T = 2 (sequences_beat_pairs)

output_dir: runs/phase5e
